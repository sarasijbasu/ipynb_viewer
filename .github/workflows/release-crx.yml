name: Release CRX

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build CRX
        run: |
          npx crx pack . -p <(echo "${{ secrets.CRX_KEY }}") -o ipynb_viewer.crx

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ipynb_viewer.crx
