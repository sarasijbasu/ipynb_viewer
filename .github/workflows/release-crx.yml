name: Build and Release CRX

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package extension folder to ZIP
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: '.'
          zipFilePath: 'build/ipynb_viewer.zip'
          ignores: |
            .git
            .github
            build
            README.md

      - name: Sign ZIP into CRX
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: 'build/ipynb_viewer.zip'
          crxFilePath: 'build/ipynb_viewer.crx'
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ipynb_viewer.crx
            build/ipynb_viewer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
