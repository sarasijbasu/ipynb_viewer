name: Build and Release CRX

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp -r manifest.json background.js content.js docx-export.js render.js viewer.css viewer.html viewer.js icons lib dist/

      - name: Restore or generate private key
        env:
          CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_KEY" ]; then
            echo "$CRX_KEY" | base64 -d > /tmp/key.pem
          else
            openssl genrsa 2048 | openssl pkcs8 -topk8 -nocrypt -out /tmp/key.pem
          fi

      - name: Build CRX and ZIP
        run: |
          npx --yes crx3 -p /tmp/key.pem -o ipynb_viewer.crx dist
          cd dist && zip -r ../ipynb_viewer.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ipynb_viewer.crx
            ipynb_viewer.zip
          generate_release_notes: true
